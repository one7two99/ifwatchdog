name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: shellcheck + test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install BusyBox (for a real ash syntax check against the actual target shell)
        run: sudo apt-get update && sudo apt-get install -y busybox

      - name: Install a pinned, current shellcheck
        # ubuntu-latest's apt package lags far behind (0.9.0) and disagrees with a
        # modern shellcheck on this codebase's guard-clause idiom (SC2015 false
        # positive on 'check && check || { log; return 1; }'). Pin the same
        # version used for local development instead of trusting apt's.
        run: |
          curl -Ls "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck ifwatchdog.sh (ash dialect - the daemon's actual target shell)
        run: shellcheck -s ash ifwatchdog/files/ifwatchdog.sh

      - name: shellcheck tests/run.sh
        run: shellcheck tests/run.sh

      - name: BusyBox ash syntax check
        run: busybox ash -n ifwatchdog/files/ifwatchdog.sh

      - name: Run test suite (tests/run.sh)
        run: sh tests/run.sh
